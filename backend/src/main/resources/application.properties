spring.application.name=sm-eventaura-backend

server.port=8081

# ==============================
# MYSQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/sm_eventaura?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=MySQL@12345

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# SESSION
# ==============================

server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax

server.servlet.session.timeout=30m

# ==============================
# ADMIN REGISTRATION
# ==============================

app.admin.registration-code=SMEventAuraAdmin2026

# ==============================
# CORS
# ==============================

app.cors.allowed-origins=http://localhost:5173
